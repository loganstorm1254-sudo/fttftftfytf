<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VECTOR — Macarena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #e11d2e;
      --red-deep: #9f1020;
      --sun: #ffd54a;
      --sky-top: #1a6bb5;
      --sky-bot: #7ec8ff;
      --plaza: #f0c27a;
      --ink: #1a1520;
      --suit: #5b2d8e;
      --suit-stripe: #7a45b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--ink);
      background: var(--sky-top);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, #ffd76a 0%, transparent 45%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 42%, #d9a24a 42%, var(--plaza) 100%);
    }

    .top {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      padding: 1.1rem 1rem 0.4rem;
    }

    #playBtn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: "Bangers", cursive;
      font-size: clamp(1.35rem, 3.5vw, 2rem);
      letter-spacing: 0.08em;
      color: #fff;
      background: linear-gradient(180deg, #ff3b4a 0%, var(--red) 45%, var(--red-deep) 100%);
      padding: 0.85rem 2.4rem 0.75rem;
      border-radius: 999px;
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.35),
        0 10px 0 var(--red-deep),
        0 18px 32px rgba(0, 0, 0, 0.28);
      transform: translateY(0);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    }

    #playBtn:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.4),
        0 12px 0 var(--red-deep),
        0 22px 36px rgba(0, 0, 0, 0.3);
    }

    #playBtn:active {
      transform: translateY(6px);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.3),
        0 4px 0 var(--red-deep),
        0 8px 16px rgba(0, 0, 0, 0.25);
    }

    #playBtn.playing {
      background: linear-gradient(180deg, #ff5a66 0%, #c41628 50%, #8a0e1a 100%);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0.5rem 1rem 2rem;
      position: relative;
    }

    .brand {
      font-family: "Bangers", cursive;
      font-size: clamp(3.2rem, 12vw, 6.5rem);
      letter-spacing: 0.06em;
      color: #fff;
      text-shadow:
        0 4px 0 #1a1520,
        0 10px 24px rgba(0, 0, 0, 0.35);
      line-height: 0.95;
      margin-top: 0.2rem;
      animation: brandPop 1.1s cubic-bezier(0.2, 1.4, 0.3, 1) both;
    }

    .tag {
      margin-top: 0.35rem;
      font-weight: 600;
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
      animation: fadeUp 0.8s 0.15s ease both;
    }

    .stage {
      margin-top: clamp(0.5rem, 3vh, 1.5rem);
      width: min(420px, 92vw);
      aspect-ratio: 3 / 4;
      position: relative;
      filter: drop-shadow(0 22px 28px rgba(0, 0, 0, 0.35));
    }

    .floor {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 4%;
      height: 8%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35), transparent 70%);
      border-radius: 50%;
      transform-origin: center;
      transition: transform 0.08s linear;
    }

    #vector {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .beat-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 24px;
      opacity: 0;
      background: radial-gradient(circle at 50% 40%, rgba(255, 213, 74, 0.35), transparent 55%);
    }

    .hud {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: rgba(26, 21, 32, 0.75);
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      animation: fadeUp 0.8s 0.25s ease both;
    }

    .hud span { opacity: 0.55; font-weight: 400; margin-right: 0.25rem; }

    .clouds {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      filter: blur(1px);
      animation: drift linear infinite;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .c1 { width: 120px; height: 40px; top: 12%; left: -10%; animation-duration: 48s; }
    .c1::before { width: 50px; height: 50px; top: -28px; left: 18px; }
    .c1::after { width: 70px; height: 70px; top: -40px; left: 48px; }
    .c2 { width: 160px; height: 48px; top: 22%; right: -15%; animation-duration: 62s; animation-delay: -20s; }
    .c2::before { width: 60px; height: 60px; top: -32px; left: 30px; }
    .c2::after { width: 80px; height: 80px; top: -48px; left: 70px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(120vw); }
    }

    @keyframes brandPop {
      from { opacity: 0; transform: scale(0.7) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---- Vector parts (SVG groups animated via CSS vars / classes) ---- */
    #vector .body-root {
      transform-origin: 160px 290px;
      transition: transform 0.09s linear;
    }

    #vector .hip {
      transform-origin: 160px 250px;
      transition: transform 0.09s linear;
    }

    #vector .arm-r, #vector .arm-l {
      transition: transform 0.09s linear;
    }

    #vector .arm-r { transform-origin: 198px 148px; }
    #vector .arm-l { transform-origin: 122px 148px; }

    #vector .fore-r { transform-origin: 220px 168px; transition: transform 0.09s linear; }
    #vector .fore-l { transform-origin: 100px 168px; transition: transform 0.09s linear; }

    #vector .hand-r { transform-origin: 236px 188px; transition: transform 0.09s linear; }
    #vector .hand-l { transform-origin: 84px 188px; transition: transform 0.09s linear; }

    #vector .leg-r, #vector .leg-l {
      transform-origin: 160px 268px;
      transition: transform 0.09s linear;
    }

    #vector .leg-r { transform-origin: 176px 268px; }
    #vector .leg-l { transform-origin: 144px 268px; }

    #vector .head {
      transform-origin: 160px 110px;
      transition: transform 0.09s linear;
    }

    #vector .brow {
      transition: transform 0.09s linear;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(225, 29, 46, 0.6);
      transition: transform 0.05s linear;
    }

    .pulse-dot.on {
      transform: scale(1.5);
      box-shadow: 0 0 0 8px rgba(225, 29, 46, 0);
    }
  </style>
</head>
<body>
  <div class="clouds" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>

  <div class="top">
    <button id="playBtn" type="button" aria-pressed="false">▶ PLAY MACARENA</button>
  </div>

  <main class="hero">
    <h1 class="brand">VECTOR</h1>
    <p class="tag">Dale a tu cuerpo alegría — on the beat</p>

    <div class="stage" id="stage">
      <div class="beat-flash" id="flash"></div>
      <svg id="vector" viewBox="0 0 320 400" role="img" aria-label="Vector dancing the Macarena">
        <defs>
          <linearGradient id="suitGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6d3aa3"/>
            <stop offset="100%" stop-color="#3d1a66"/>
          </linearGradient>
          <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
            <rect width="10" height="10" fill="#5b2d8e"/>
            <rect width="4" height="10" fill="#7a45b0"/>
          </pattern>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.25"/>
          </filter>
        </defs>

        <g class="body-root" id="bodyRoot">
          <!-- legs -->
          <g class="leg-l" id="legL">
            <path d="M144 268 L132 340 L150 340 L156 268 Z" fill="url(#suitGrad)"/>
            <ellipse cx="138" cy="346" rx="22" ry="10" fill="#1a1520"/>
          </g>
          <g class="leg-r" id="legR">
            <path d="M176 268 L170 340 L188 340 L188 268 Z" fill="url(#suitGrad)"/>
            <ellipse cx="182" cy="346" rx="22" ry="10" fill="#1a1520"/>
          </g>

          <!-- hips / torso -->
          <g class="hip" id="hip">
            <path d="M118 145
                     C112 175 110 210 118 255
                     L202 255
                     C210 210 208 175 202 145 Z" fill="url(#stripes)" filter="url(#soft)"/>
            <!-- belt -->
            <rect x="120" y="248" width="80" height="12" rx="2" fill="#1a1520"/>
            <rect x="152" y="248" width="16" height="12" fill="#ffd54a"/>
            <!-- white shirt V -->
            <path d="M160 148 L140 210 L180 210 Z" fill="#f5f0ea"/>
            <path d="M160 148 L152 175 L168 175 Z" fill="#c41628"/>
          </g>

          <!-- arms -->
          <g class="arm-l" id="armL">
            <path d="M122 148 C105 155 95 170 98 190" stroke="#f0c9a0" stroke-width="16" stroke-linecap="round" fill="none"/>
            <g class="fore-l" id="foreL">
              <path d="M98 188 C90 205 85 220 88 235" stroke="#f0c9a0" stroke-width="14" stroke-linecap="round" fill="none"/>
              <g class="hand-l" id="handL">
                <ellipse cx="88" cy="242" rx="14" ry="10" fill="#f0c9a0"/>
                <ellipse id="palmL" cx="88" cy="242" rx="10" ry="5" fill="#e0b48a" opacity="0.5"/>
              </g>
            </g>
            <circle cx="122" cy="148" r="10" fill="#f0c9a0"/>
          </g>

          <g class="arm-r" id="armR">
            <path d="M198 148 C215 155 225 170 222 190" stroke="#f0c9a0" stroke-width="16" stroke-linecap="round" fill="none"/>
            <g class="fore-r" id="foreR">
              <path d="M222 188 C230 205 235 220 232 235" stroke="#f0c9a0" stroke-width="14" stroke-linecap="round" fill="none"/>
              <g class="hand-r" id="handR">
                <ellipse cx="232" cy="242" rx="14" ry="10" fill="#f0c9a0"/>
                <ellipse id="palmR" cx="232" cy="242" rx="10" ry="5" fill="#e0b48a" opacity="0.5"/>
              </g>
            </g>
            <circle cx="198" cy="148" r="10" fill="#f0c9a0"/>
          </g>

          <!-- head -->
          <g class="head" id="head">
            <ellipse cx="160" cy="96" rx="48" ry="52" fill="#f0c9a0" filter="url(#soft)"/>
            <!-- hair -->
            <path d="M118 85 C120 45 160 35 200 50 C195 70 185 78 160 78 C140 78 125 80 118 85 Z" fill="#1a1520"/>
            <path d="M125 55 Q140 40 155 52" fill="none" stroke="#1a1520" stroke-width="8" stroke-linecap="round"/>
            <!-- brows -->
            <g class="brow" id="brows">
              <path d="M132 88 Q142 82 152 88" fill="none" stroke="#1a1520" stroke-width="4" stroke-linecap="round"/>
              <path d="M168 88 Q178 82 188 88" fill="none" stroke="#1a1520" stroke-width="4" stroke-linecap="round"/>
            </g>
            <!-- eyes -->
            <ellipse cx="142" cy="100" rx="8" ry="10" fill="#fff"/>
            <ellipse cx="178" cy="100" rx="8" ry="10" fill="#fff"/>
            <circle cx="144" cy="102" r="4" fill="#1a1520"/>
            <circle cx="180" cy="102" r="4" fill="#1a1520"/>
            <circle cx="145" cy="100" r="1.5" fill="#fff"/>
            <circle cx="181" cy="100" r="1.5" fill="#fff"/>
            <!-- big nose -->
            <path d="M160 105 C168 118 172 128 160 132 C148 128 152 118 160 105 Z" fill="#e8b48a"/>
            <!-- smirk -->
            <path id="mouth" d="M148 142 Q160 152 172 142" fill="none" stroke="#a85a4a" stroke-width="3" stroke-linecap="round"/>
            <!-- chin -->
            <ellipse cx="160" cy="155" rx="18" ry="10" fill="#e8b48a" opacity="0.85"/>
          </g>
        </g>
      </svg>
      <div class="floor" id="floor"></div>
    </div>

    <div class="hud" aria-live="polite">
      <div class="pulse-dot" id="pulse"></div>
      <div><span>step</span><strong id="stepLabel">—</strong></div>
      <div><span>beat</span><strong id="beatLabel">0</strong></div>
    </div>
  </main>

  <audio id="audio" src="macarena.mp3" preload="auto"></audio>

  <script>
    /**
     * Los del Río — Macarena ≈ 103 BPM.
     * Dance phrase = 16 beats; classic arm sequence then hip sway + quarter turn.
     * Beat 0 aligned after a short intro (tweakable).
     */
    const BPM = 103;
    const BEAT = 60 / BPM;
    // Energy kick / danceable groove on this lyrics rip
    let OFFSET = 9.35;

    const STEPS = [
      "R arm out · palm down",
      "L arm out · palm down",
      "R palm up",
      "L palm up",
      "R → L shoulder",
      "L → R shoulder",
      "R → head",
      "L → head",
      "R → L hip",
      "L → R hip",
      "R → R hip",
      "L → L hip",
      "hips · sway",
      "hips · sway",
      "jump turn!",
      "land · reset"
    ];

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const pulse = document.getElementById("pulse");
    const flash = document.getElementById("flash");
    const floor = document.getElementById("floor");
    const stepLabel = document.getElementById("stepLabel");
    const beatLabel = document.getElementById("beatLabel");

    const els = {
      body: document.getElementById("bodyRoot"),
      hip: document.getElementById("hip"),
      armR: document.getElementById("armR"),
      armL: document.getElementById("armL"),
      foreR: document.getElementById("foreR"),
      foreL: document.getElementById("foreL"),
      handR: document.getElementById("handR"),
      handL: document.getElementById("handL"),
      legR: document.getElementById("legR"),
      legL: document.getElementById("legL"),
      head: document.getElementById("head"),
      brows: document.getElementById("brows"),
      mouth: document.getElementById("mouth"),
    };

    let lastStep = -1;
    let facing = 0; // 0,1,2,3 quarters
    let raf = 0;

    function setT(el, t) {
      el.setAttribute("transform", t);
    }

    function resetPose() {
      setT(els.body, "");
      setT(els.hip, "");
      setT(els.armR, "");
      setT(els.armL, "");
      setT(els.foreR, "");
      setT(els.foreL, "");
      setT(els.handR, "");
      setT(els.handL, "");
      setT(els.legR, "");
      setT(els.legL, "");
      setT(els.head, "");
      setT(els.brows, "");
    }

    /** Apply Macarena pose for step 0–15 */
    function applyStep(step, beatFrac) {
      const bob = Math.sin(beatFrac * Math.PI) * 3;
      const faceRot = facing * 90;
      setT(els.body, `rotate(${faceRot} 160 290) translate(0 ${bob})`);

      // idle base arms down-ish
      let armR = "", armL = "", foreR = "", foreL = "", handR = "", handL = "";
      let hip = "";
      let legR = "", legL = "";
      let head = `rotate(${Math.sin(beatFrac * Math.PI * 2) * 2} 160 110)`;

      switch (step) {
        case 0: // R out palm down
          armR = "rotate(-75 198 148)";
          foreR = "rotate(-20 220 168)";
          handR = "rotate(0 236 188)";
          armL = "rotate(12 122 148)";
          break;
        case 1: // both out palm down
          armR = "rotate(-75 198 148)";
          foreR = "rotate(-20 220 168)";
          armL = "rotate(75 122 148)";
          foreL = "rotate(20 100 168)";
          break;
        case 2: // R palm up
          armR = "rotate(-75 198 148)";
          foreR = "rotate(-15 220 168)";
          handR = "rotate(180 236 188)";
          armL = "rotate(75 122 148)";
          foreL = "rotate(20 100 168)";
          break;
        case 3: // both palm up
          armR = "rotate(-75 198 148)";
          handR = "rotate(180 236 188)";
          armL = "rotate(75 122 148)";
          handL = "rotate(180 84 188)";
          break;
        case 4: // R to L shoulder
          armR = "rotate(-110 198 148)";
          foreR = "rotate(-100 220 168)";
          handR = "rotate(-40 236 188)";
          armL = "rotate(40 122 148)";
          break;
        case 5: // L to R shoulder
          armR = "rotate(-40 198 148)";
          armL = "rotate(110 122 148)";
          foreL = "rotate(100 100 168)";
          handL = "rotate(40 84 188)";
          break;
        case 6: // R to head
          armR = "rotate(-140 198 148)";
          foreR = "rotate(-70 220 168)";
          handR = "rotate(-20 236 188)";
          armL = "rotate(30 122 148)";
          head = "rotate(-6 160 110)";
          break;
        case 7: // L to head
          armR = "rotate(-30 198 148)";
          armL = "rotate(140 122 148)";
          foreL = "rotate(70 100 168)";
          head = "rotate(6 160 110)";
          break;
        case 8: // R to L hip
          armR = "rotate(-50 198 148)";
          foreR = "rotate(-90 220 168)";
          handR = "rotate(-30 236 188)";
          armL = "rotate(15 122 148)";
          hip = "rotate(-8 160 250)";
          break;
        case 9: // L to R hip
          armL = "rotate(50 122 148)";
          foreL = "rotate(90 100 168)";
          handL = "rotate(30 84 188)";
          armR = "rotate(-15 198 148)";
          hip = "rotate(8 160 250)";
          break;
        case 10: // R to R hip
          armR = "rotate(25 198 148)";
          foreR = "rotate(70 220 168)";
          hip = "rotate(10 160 250)";
          armL = "rotate(10 122 148)";
          break;
        case 11: // L to L hip
          armL = "rotate(-25 122 148)";
          foreL = "rotate(-70 100 168)";
          hip = "rotate(-10 160 250)";
          armR = "rotate(-10 198 148)";
          break;
        case 12:
        case 13: { // hip sway
          const s = step === 12 ? 1 : -1;
          const wiggle = Math.sin(beatFrac * Math.PI) * 14 * s;
          hip = `rotate(${wiggle} 160 250)`;
          armR = `rotate(${-20 + wiggle * 0.4} 198 148)`;
          armL = `rotate(${20 + wiggle * 0.4} 122 148)`;
          legR = `rotate(${wiggle * 0.35} 176 268)`;
          legL = `rotate(${wiggle * 0.35} 144 268)`;
          break;
        }
        case 14: { // jump turn
          const lift = Math.sin(beatFrac * Math.PI) * 28;
          setT(els.body, `rotate(${faceRot + beatFrac * 90} 160 290) translate(0 ${-lift})`);
          armR = "rotate(-100 198 148)";
          armL = "rotate(100 122 148)";
          legR = "rotate(18 176 268)";
          legL = "rotate(-18 144 268)";
          hip = "rotate(0 160 250)";
          floor.style.transform = `scale(${1 + beatFrac * 0.15}, ${1 - beatFrac * 0.25})`;
          break;
        }
        case 15: // land
          armR = "rotate(-15 198 148)";
          armL = "rotate(15 122 148)";
          legR = "";
          legL = "";
          floor.style.transform = "scale(1.05, 0.9)";
          break;
        default:
          break;
      }

      if (step !== 14) {
        floor.style.transform = `scale(${1 + Math.sin(beatFrac * Math.PI) * 0.04}, ${1 - Math.sin(beatFrac * Math.PI) * 0.05})`;
      }

      setT(els.armR, armR);
      setT(els.armL, armL);
      setT(els.foreR, foreR);
      setT(els.foreL, foreL);
      setT(els.handR, handR);
      setT(els.handL, handL);
      setT(els.hip, hip);
      setT(els.legR, legR);
      setT(els.legL, legL);
      setT(els.head, head);
      setT(els.brows, `translate(0 ${step >= 12 ? -2 : 0})`);
    }

    function tick() {
      if (audio.paused) {
        raf = 0;
        return;
      }
      const t = audio.currentTime;
      if (t < OFFSET) {
        resetPose();
        setT(els.body, `translate(0 ${Math.sin(t * 4) * 2})`);
        stepLabel.textContent = "intro…";
        beatLabel.textContent = "—";
        raf = requestAnimationFrame(tick);
        return;
      }

      const elapsed = t - OFFSET;
      const totalBeats = elapsed / BEAT;
      const beatIndex = Math.floor(totalBeats);
      const beatFrac = totalBeats - beatIndex;
      const step = ((beatIndex % 16) + 16) % 16;
      const phrase = Math.floor(beatIndex / 16);
      facing = phrase % 4;

      if (step !== lastStep) {
        lastStep = step;
        pulse.classList.remove("on");
        void pulse.offsetWidth;
        pulse.classList.add("on");
        flash.style.opacity = "1";
        flash.style.transition = "none";
        requestAnimationFrame(() => {
          flash.style.transition = "opacity 0.28s ease";
          flash.style.opacity = "0";
        });
        stepLabel.textContent = STEPS[step];
        beatLabel.textContent = String(beatIndex + 1);
        // mouth open a bit on chorus-y steps
        if (step === 14 || step === 0) {
          els.mouth.setAttribute("d", "M148 140 Q160 158 172 140");
        } else {
          els.mouth.setAttribute("d", "M148 142 Q160 152 172 142");
        }
      }

      applyStep(step, beatFrac);
      raf = requestAnimationFrame(tick);
    }

    async function toggle() {
      if (audio.paused) {
        try {
          await audio.play();
        } catch (err) {
          console.warn(err);
          playBtn.textContent = "▶ TAP AGAIN";
          return;
        }
        playBtn.textContent = "❚❚ PAUSE";
        playBtn.classList.add("playing");
        playBtn.setAttribute("aria-pressed", "true");
        if (!raf) raf = requestAnimationFrame(tick);
      } else {
        audio.pause();
        playBtn.textContent = "▶ PLAY MACARENA";
        playBtn.classList.remove("playing");
        playBtn.setAttribute("aria-pressed", "false");
        floor.style.transform = "";
      }
    }

    playBtn.addEventListener("click", toggle);
    audio.addEventListener("ended", () => {
      playBtn.textContent = "▶ PLAY MACARENA";
      playBtn.classList.remove("playing");
      playBtn.setAttribute("aria-pressed", "false");
      resetPose();
      facing = 0;
      lastStep = -1;
      stepLabel.textContent = "—";
      beatLabel.textContent = "0";
    });

    // Shift+←/→ nudges beat sync by 50ms while playing
    window.addEventListener("keydown", (e) => {
      if (!e.shiftKey) return;
      if (e.key === "ArrowLeft") {
        OFFSET = Math.max(0, OFFSET - 0.05);
        console.log("OFFSET", OFFSET.toFixed(2));
      } else if (e.key === "ArrowRight") {
        OFFSET += 0.05;
        console.log("OFFSET", OFFSET.toFixed(2));
      } else if (e.code === "Space") {
        e.preventDefault();
        toggle();
      }
    });

    resetPose();
  </script>
</body>
</html>
