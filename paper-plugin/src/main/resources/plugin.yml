name: ChunkBoomerits
version: '${version}'
main: com.chunkboomerits.paper.ChunkBoomeritsPlugin
api-version: '1.21'
authors: [Logan]
description: OP tools + custom music discs for Paper/Purpur 1.21.11
website: https://github.com/loganstorm1254-sudo/fttftftfytf

commands:
  chunkboomerits:
    description: Give Chunk Boomerits (OP only)
    usage: /chunkboomerits [player] [amount]
    permission: chunkboomerits.give
    aliases: [boomerits, cboomerits]
  givechunkboomerits:
    description: Alias for giving Chunk Boomerits
    usage: /givechunkboomerits <player> [amount]
    permission: chunkboomerits.give
  kicksword:
    description: Give the Kick Sword (OP only)
    usage: /kicksword [player]
    permission: chunkboomerits.kicksword
    aliases: [kick_sword, opkicksword]
  despacito:
    description: Give the Despacito music disc
    usage: /despacito [player]
    permission: chunkboomerits.disc
    aliases: [despacitodisc, musicdiscdespacito]
  moskau:
    description: Give the Moskau music disc
    usage: /moskau [player]
    permission: chunkboomerits.disc
    aliases: [moskaudisc, dschinghiskhan]
  kimjonggoon:
    description: Give the Kim Jong Goon music disc
    usage: /kimjonggoon [player]
    permission: chunkboomerits.disc
    aliases: [kimjong, hyperbaiter, kimjonggoondisc]

permissions:
  chunkboomerits.give:
    description: Give and use Chunk Boomerits
    default: op
  chunkboomerits.use:
    description: Throw Chunk Boomerits to delete chunks
    default: op
  chunkboomerits.kicksword:
    description: Give and use the Kick Sword
    default: op
  chunkboomerits.disc:
    description: Give custom music discs
    default: true
  chunkboomerits.*:
    description: All Chunk Boomerits tools
    default: op
    children:
      chunkboomerits.give: true
      chunkboomerits.use: true
      chunkboomerits.kicksword: true
      chunkboomerits.disc: true
