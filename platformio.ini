; ESP32 one-chunk Minecraft server (bareiron-based)
; Framework MUST be espidf — Arduino will not work.

[platformio]
default_envs = esp32-c3-supermini

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; bareiron trips a few pedantic warnings treated as errors in stock IDF flags
build_unflags =
	-Werror
	-Werror=all
build_flags =
	-Wno-error=parentheses
	-O2
	-DBOARD_HAS_PSRAM=0

; --- ESP32-C3 SuperMini (default) ---
; Many SuperMinis are 2MB flash (not 4MB). Native USB Serial/JTAG.
; If upload fails: hold BOOT, tap RESET, release BOOT, then upload again.
[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 2MB
board_upload.flash_size = 2MB
board_upload.maximum_size = 2097152
board_build.partitions = partitions_2mb.csv
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0

[env:esp32-c3]
extends = env:esp32-c3-supermini

[env:esp32dev]
board = esp32dev
board_build.f_cpu = 240000000L

[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
